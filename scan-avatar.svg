    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset=".5" stop-color="#22d3ee" stop-opacity=".95"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#0e2a3f" stroke-width="1" opacity=".55"/>
  </pattern>
  <clipPath id="frame"><rect x="10" y="10" width="300" height="410" rx="12"/></clipPath>
</defs>

<rect x="10" y="10" width="300" height="410" rx="12" fill="#020814"/>
