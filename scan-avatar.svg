<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "DejaVu Sans Mono", monospace; }
  .flicker { animation: flicker 3.8s infinite; }
  .blink { animation: blink 1.1s steps(2) infinite; }
  .spin { animation: spin 18s linear infinite; transform-origin: 160px 200px; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes flicker { 0%,100% { opacity:1; } 91% { opacity:1; } 92% { opacity:.55; } 93% { opacity:1; } 95% { opacity:.7; } 96% { opacity:1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<defs>
